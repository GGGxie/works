<!doctype html>
<!-- 分享卡片（Open Graph）的设计源，改完跑 npm run og 重新出图 -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        background: #09090b;
        color: #f4f4f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
        background-image: linear-gradient(#18181b 1px, transparent 1px),
          linear-gradient(90deg, #18181b 1px, transparent 1px);
        background-size: 48px 48px;
      }

      .top {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .avatar {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        border: 1px solid #27272a;
      }

      .name {
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .role {
        margin-top: 4px;
        font-size: 18px;
        color: #a1a1aa;
      }

      .bio {
        font-size: 30px;
        line-height: 1.5;
        font-weight: 500;
        letter-spacing: -0.02em;
        max-width: 900px;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .tag {
        padding: 8px 16px;
        border: 1px solid #27272a;
        border-radius: 9999px;
        font-size: 17px;
        color: #a1a1aa;
      }

      .bottom {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        font-size: 19px;
        color: #52525b;
      }

      .site {
        color: #f4f4f5;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <img class="avatar" src="../public/images/avatar.png" alt="" />
      <div>
        <div class="name">GGGxie</div>
        <div class="role">全栈工程师 · Full-Stack Engineer</div>
      </div>
    </div>

    <div>
      <p class="bio">后端架构、AI Agent 应用与云原生实践，<br />10 个从想法做到线上的个人项目。</p>
      <div class="tags" style="margin-top: 28px">
        <span class="tag">Go</span>
        <span class="tag">Python</span>
        <span class="tag">React</span>
        <span class="tag">FastAPI</span>
        <span class="tag">LangGraph</span>
        <span class="tag">MCP</span>
        <span class="tag">Kubernetes</span>
      </div>
    </div>

    <div class="bottom">
      <span class="site">works.gggxie.com</span>
      <span>个人作品集</span>
    </div>
  </body>
</html>
